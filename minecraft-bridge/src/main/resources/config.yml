# The Plug Minecraft bridge
#
# This Paper plugin writes only Minecraft telemetry/activity to a dedicated Turso
# database. It never needs your Discord bot token, Idle Grow Supabase credentials,
# or any other bot's database secret.
#
# SETUP ORDER
# 1) Start The Plug once with MINECRAFT_TURSO_DATABASE_URL and
#    MINECRAFT_TURSO_AUTH_TOKEN so it creates the Minecraft tables.
# 2) Create a separate fine-grained Turso token for this Paper bridge.
# 3) Paste the database/HTTP URL, restricted bridge token, and Discord guild ID below.
# 4) Restart Paper normally. Do not use /reload.
#
# The bridge never collects player IP addresses.

turso-http-url: ""
turso-bridge-token: ""
guild-id: 0

# Responsive enough for status/player snapshots without excessive database writes.
# Allowed range: 5-300 seconds.
heartbeat-seconds: 15
