name: Apply World Mode Phase 4 Clean

on:
  push:
    branches:
      - feature/world-mode-controls

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_TOKEN: ''
      IDLE_SUPABASE_URL: ''
      IDLE_SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply Phase 4 patch
        id: patch
        run: |
          set +e
          python tools/apply_world_mode_phase4.py > phase4-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact patch diagnostic
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cp phase4-diagnostic.log /tmp/phase4-diagnostic.log
          git reset --hard HEAD
          cp /tmp/phase4-diagnostic.log PHASE4_PATCH_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE4_PATCH_FAILURE.log
          git commit -m 'Record exact world mode phase 4 failure'
          git push origin HEAD:feature/world-mode-controls

      - name: Stop after patch failure
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1

      - name: Remove patch script and diagnostic
        if: steps.patch.outputs.exit_code == '0'
        run: rm -f tools/apply_world_mode_phase4.py phase4-diagnostic.log PHASE4_PATCH_FAILURE.log

      - name: Compile Phase 4 source
        if: steps.patch.outputs.exit_code == '0'
        run: python -m compileall -q .

      - name: Run focused Phase 4 tests
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m pytest -q \
            tests/test_world_modes_core.py \
            tests/test_world_mode_phase3_contract.py \
            tests/test_world_mode_phase4_contract.py \
            tests/test_economy_scoped_persistence_contract.py \
            tests/test_social_guild_scope_contract.py \
            tests/test_crime_scoped_persistence_contract.py \
            tests/test_command_surface_uniqueness.py

      - name: Run full pre-background regression suite
        if: steps.patch.outputs.exit_code == '0'
        run: python -m pytest -q --tb=short -x --ignore=tests/test_world_mode_integration_contract.py

      - name: Inspect cleanup and whitespace
        if: steps.patch.outputs.exit_code == '0'
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_world_mode_phase4.py
          test ! -f PHASE4_PATCH_FAILURE.log

      - name: Commit validated Phase 4 source
        if: steps.patch.outputs.exit_code == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate multiplayer economy and crime by world mode'
          git push origin HEAD:feature/world-mode-controls
