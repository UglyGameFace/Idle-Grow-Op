name: Finalize Live Profile Runtime

on:
  push:
    branches:
      - feature/live-profile-signatures

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-signatures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply runtime hardening
        run: python tools/finalize_live_profile_runtime.py

      - name: Remove temporary files
        run: |
          rm tools/finalize_live_profile_runtime.py
          rm .github/workflows/finalize-live-profile-runtime.yml

      - name: Validate final runtime
        env:
          DISCORD_TOKEN: ''
          IDLE_SUPABASE_URL: ''
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          python -m compileall -q .
          python -m pytest -q tests/test_profile_signature_core.py tests/test_profile_signature_contract.py
          python -m pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit final runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ensure newest speaker wins signature updates'
          git push origin HEAD:feature/live-profile-signatures
