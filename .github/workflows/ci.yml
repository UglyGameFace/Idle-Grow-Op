name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        id: pytest
        env:
          DISCORD_TOKEN: ""
          IDLE_SUPABASE_URL: ""
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set +e
          python -m pytest -q --tb=short -x > pytest.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: |
          cat pytest.log
          exit 1

      - name: Load every Enterprise extension into the bot
        id: extension_load
        env:
          DISCORD_TOKEN: ""
          IDLE_SUPABASE_URL: ""
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set +e
          python - <<'PY' > extension-load.log 2>&1
          import asyncio

          from scoped_database import ScopedDatabaseManager


          class SmokeBackend:
              async def load(self, key):
                  return None

              async def save_many(self, records):
                  return None

              async def list_guild_leaderboard(self, guild_id, *, limit=10):
                  return []

              async def list_guild_heist_leaderboard(self, guild_id, *, limit=10):
                  return []

              async def list_guild_casino_leaderboard(self, guild_id, *, metric="casino_total_profit", limit=10):
                  return []

              async def list_guild_notification_candidates(self, guild_id, *, limit=500):
                  return []


          async def smoke_test():
              import main

              database = ScopedDatabaseManager(SmokeBackend(), flush_interval=3600)
              await database.start()
              main.bot.db = database
              try:
                  async with main.bot:
                      await main.load_extensions()

                      expected = set(main.GAME_EXTENSIONS)
                      loaded = set(main.bot.extensions)
                      assert loaded == expected, (
                          f"loaded={sorted(loaded)} expected={sorted(expected)}"
                      )
              finally:
                  await database.close()


          asyncio.run(smoke_test())
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload extension-load log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-load-log
          path: extension-load.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when extension loading failed
        if: steps.extension_load.outputs.exit_code != '0'
        run: |
          cat extension-load.log
          exit 1

      - name: Reject legacy persistence and backup artifacts
        run: |
          ! grep -R -nE '(^|[^A-Z_])SUPABASE_(URL|KEY|SERVICE_ROLE_KEY)|IDLE_SUPABASE_KEY|db_manager|class Database|\.world_state|\.get_user\(|await .*\.save\(\)|Local JSON|memory-only fallback' \
            main.py utils.py persistence_bootstrap.py scoped_database.py supabase_scoped_backend.py \
            admin.py ai.py crime.py economy.py farming.py gambling.py lab.py progression.py quick.py sesh.py social.py tasks.py world_modes.py
          test ! -d cogs
          test ! -f .env
          test ! -f database.json
          test ! -f database.json.bak

  integrate_world_mode_phase3:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/feature/world-mode-controls' ||
      github.event.pull_request.head.ref == 'feature/world-mode-controls')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_TOKEN: ''
      IDLE_SUPABASE_URL: ''
      IDLE_SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply phase 3 routing
        id: patch
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_world_mode_phase3.py')
          source = path.read_text(encoding='utf-8')
          old = '''    "self.bot.db.mark_profile_dirty(guild_id, ctx.author.id)",
    "self.bot.db.mark_profile_dirty(scope.scope_id, ctx.author.id)",
    5,
)'''
          new = '''    "self.bot.db.mark_profile_dirty(guild_id, ctx.author.id)",
    "self.bot.db.mark_profile_dirty(scope.scope_id, ctx.author.id)",
    6,
)'''
          if source.count(old) != 1:
              raise RuntimeError('lab dirty-count patch anchor changed')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/apply_world_mode_phase3.py > phase3-patch.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-patch-log
          path: phase3-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when patch application fails
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cat phase3-patch.log
          exit 1

      - name: Remove temporary patch script
        run: rm -f tools/apply_world_mode_phase3.py phase3-patch.log

      - name: Compile routed sources
        run: python -m compileall -q .

      - name: Run focused phase 3 tests
        run: |
          python -m pytest -q \
            tests/test_world_modes_core.py \
            tests/test_world_mode_phase3_contract.py \
            tests/test_lab_scoped_persistence_contract.py \
            tests/test_profile_signature_core.py \
            tests/test_profile_signature_contract.py \
            tests/test_optional_sesh_setup_contract.py \
            tests/test_sesh_concept_contract.py \
            tests/test_command_surface_uniqueness.py

      - name: Run existing regression suite
        id: regressions
        run: |
          set +e
          python -m pytest -q --tb=short -x --ignore=tests/test_world_mode_integration_contract.py > phase3-regression.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload phase 3 regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-regression-log
          path: phase3-regression.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when regressions fail
        if: steps.regressions.outputs.exit_code != '0'
        run: |
          cat phase3-regression.log
          exit 1

      - name: Inspect cleanup and whitespace
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f phase3-regression.log
          git diff --check
          test ! -f tools/apply_world_mode_phase3.py

      - name: Commit and push phase 3 source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route lab casino sesh and profiles through world modes'
          git push origin HEAD:feature/world-mode-controls
