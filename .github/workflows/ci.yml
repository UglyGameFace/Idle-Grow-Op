name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        id: pytest
        env:
          DISCORD_TOKEN: ""
          IDLE_SUPABASE_URL: ""
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set +e
          python -m pytest -q --tb=short -x > pytest.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: |
          cat pytest.log
          exit 1

      - name: Load every Enterprise extension into the bot
        id: extension_load
        env:
          DISCORD_TOKEN: ""
          IDLE_SUPABASE_URL: ""
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set +e
          python - <<'PY' > extension-load.log 2>&1
          import asyncio

          from scoped_database import ScopedDatabaseManager


          class SmokeBackend:
              async def load(self, key):
                  return None

              async def save_many(self, records):
                  return None

              async def list_guild_leaderboard(self, guild_id, *, limit=10):
                  return []

              async def list_guild_heist_leaderboard(self, guild_id, *, limit=10):
                  return []

              async def list_guild_casino_leaderboard(self, guild_id, *, metric="casino_total_profit", limit=10):
                  return []

              async def list_guild_notification_candidates(self, guild_id, *, limit=500):
                  return []


          async def smoke_test():
              import main

              database = ScopedDatabaseManager(SmokeBackend(), flush_interval=3600)
              await database.start()
              main.bot.db = database
              try:
                  async with main.bot:
                      await main.load_extensions()

                      expected = set(main.GAME_EXTENSIONS)
                      loaded = set(main.bot.extensions)
                      assert loaded == expected, (
                          f"loaded={sorted(loaded)} expected={sorted(expected)}"
                      )
              finally:
                  await database.close()


          asyncio.run(smoke_test())
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload extension-load log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-load-log
          path: extension-load.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when extension loading failed
        if: steps.extension_load.outputs.exit_code != '0'
        run: |
          cat extension-load.log
          exit 1

      - name: Reject legacy persistence and backup artifacts
        run: |
          ! grep -R -nE '(^|[^A-Z_])SUPABASE_(URL|KEY|SERVICE_ROLE_KEY)|IDLE_SUPABASE_KEY|db_manager|class Database|\.world_state|\.get_user\(|await .*\.save\(\)|Local JSON|memory-only fallback' \
            main.py utils.py persistence_bootstrap.py scoped_database.py supabase_scoped_backend.py \
            admin.py ai.py crime.py economy.py farming.py gambling.py lab.py progression.py quick.py sesh.py social.py tasks.py world_modes.py
          test ! -d cogs
          test ! -f .env
          test ! -f database.json
          test ! -f database.json.bak

  integrate_world_mode_phase4:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/world-mode-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_TOKEN: ''
      IDLE_SUPABASE_URL: ''
      IDLE_SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply Phase 4 multiplayer routing
        id: patch
        run: |
          set +e
          python - <<'PY' > phase4-diagnostic.log 2>&1
          from __future__ import annotations

          import io
          import token
          import tokenize
          from pathlib import Path

          path = Path('tools/apply_world_mode_phase4.py')
          source = path.read_text(encoding='utf-8')
          rewritten_tokens = []
          converted = 0
          for item in tokenize.generate_tokens(io.StringIO(source).readline):
              if item.type == token.STRING and item.string.startswith(("'''", '"""')):
                  item = tokenize.TokenInfo(
                      item.type,
                      'r' + item.string,
                      item.start,
                      item.end,
                      item.line,
                  )
                  converted += 1
              rewritten_tokens.append(item)
          if converted < 10:
              raise RuntimeError(f'Expected generated source blocks; converted only {converted}')
          rewritten = tokenize.untokenize(rewritten_tokens)
          compile(rewritten, str(path), 'exec')
          path.write_text(rewritten, encoding='utf-8')
          print(f'Converted {converted} generated blocks to raw strings')
          PY
          code=$?
          if [ "$code" -eq 0 ]; then
            python tools/apply_world_mode_phase4.py >> phase4-diagnostic.log 2>&1
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Phase 4 patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-patch-log
          path: phase4-diagnostic.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when patch application fails
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cat phase4-diagnostic.log
          exit 1

      - name: Remove temporary Phase 4 artifacts
        if: steps.patch.outputs.exit_code == '0'
        run: rm -f tools/apply_world_mode_phase4.py phase4-diagnostic.log PHASE4_PATCH_FAILURE.log

      - name: Compile Phase 4 sources
        if: steps.patch.outputs.exit_code == '0'
        run: python -m compileall -q .

      - name: Run focused Phase 4 tests
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m pytest -q \
            tests/test_world_modes_core.py \
            tests/test_world_mode_phase3_contract.py \
            tests/test_world_mode_phase4_contract.py \
            tests/test_economy_scoped_persistence_contract.py \
            tests/test_social_guild_scope_contract.py \
            tests/test_crime_scoped_persistence_contract.py \
            tests/test_command_surface_uniqueness.py

      - name: Run complete pre-background regression suite
        if: steps.patch.outputs.exit_code == '0'
        run: python -m pytest -q --tb=short -x --ignore=tests/test_world_mode_integration_contract.py

      - name: Inspect cleanup and whitespace
        if: steps.patch.outputs.exit_code == '0'
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_world_mode_phase4.py
          test ! -f PHASE4_PATCH_FAILURE.log

      - name: Commit and push validated Phase 4 source
        if: steps.patch.outputs.exit_code == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate multiplayer economy and crime by world mode'
          git push origin HEAD:feature/world-mode-controls
