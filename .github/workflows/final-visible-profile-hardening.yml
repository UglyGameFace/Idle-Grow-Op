name: Final Visible Profile Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feature/live-profile-signatures' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-signatures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply corrected privacy hardening
        run: python tools/apply_final_privacy_hardening.py

      - name: Migrate the debounce contract to the generation helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_profile_signature_contract.py')
          source = path.read_text(encoding='utf-8')
          old = '    assert "previous.cancel()" in SOURCE\n'
          new = '    assert "pending.cancel()" in SOURCE\n'
          if source.count(old) != 1:
              raise RuntimeError(f'Expected one old cancellation contract, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove every temporary hardening path
        run: |
          rm -f tools/apply_final_privacy_hardening.py
          rm -f tools/close_signature_privacy_races.py
          rm -f .github/workflows/apply-final-privacy-hardening.yml
          rm -f .github/workflows/close-signature-privacy-races.yml
          rm -f .github/workflows/final-visible-profile-hardening.yml

      - name: Validate corrected implementation
        env:
          DISCORD_TOKEN: ''
          IDLE_SUPABASE_URL: ''
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          python -m compileall -q .
          python -m pytest -q tests/test_profile_signature_core.py tests/test_profile_signature_contract.py
          python -m pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_final_privacy_hardening.py
          test ! -f tools/close_signature_privacy_races.py
          test ! -f .github/workflows/apply-final-privacy-hardening.yml
          test ! -f .github/workflows/close-signature-privacy-races.yml
          test ! -f .github/workflows/final-visible-profile-hardening.yml

      - name: Commit corrected privacy hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize live signature privacy safety'
          git push origin HEAD:feature/live-profile-signatures
