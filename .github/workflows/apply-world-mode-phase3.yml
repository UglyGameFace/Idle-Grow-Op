name: Apply World Mode Phase 3

on:
  pull_request:
    branches:
      - feature/world-mode-controls
    types:
      - opened

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'chore/world-mode-phase3-trigger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_TOKEN: ''
      IDLE_SUPABASE_URL: ''
      IDLE_SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply and validate phase 3
        id: pipeline
        run: |
          set +e
          : > PHASE3_DIAGNOSTIC.log
          echo 'STAGE: runtime anchor correction' >> PHASE3_DIAGNOSTIC.log
          python - <<'PY' >> PHASE3_DIAGNOSTIC.log 2>&1
          from pathlib import Path
          path = Path('tools/apply_world_mode_phase3.py')
          source = path.read_text(encoding='utf-8')
          old = '''    "self.bot.db.mark_profile_dirty(guild_id, ctx.author.id)",
    "self.bot.db.mark_profile_dirty(scope.scope_id, ctx.author.id)",
    5,
)'''
          new = '''    "self.bot.db.mark_profile_dirty(guild_id, ctx.author.id)",
    "self.bot.db.mark_profile_dirty(scope.scope_id, ctx.author.id)",
    6,
)'''
          if source.count(old) != 1:
              raise RuntimeError('lab dirty-count patch anchor changed')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          code=$?
          if [ "$code" -eq 0 ]; then
            echo 'STAGE: apply source patch' >> PHASE3_DIAGNOSTIC.log
            python tools/apply_world_mode_phase3.py >> PHASE3_DIAGNOSTIC.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            rm -f tools/apply_world_mode_phase3.py
            echo 'STAGE: compile' >> PHASE3_DIAGNOSTIC.log
            python -m compileall -q . >> PHASE3_DIAGNOSTIC.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo 'STAGE: focused tests' >> PHASE3_DIAGNOSTIC.log
            python -m pytest -q \
              tests/test_world_modes_core.py \
              tests/test_world_mode_phase3_contract.py \
              tests/test_lab_scoped_persistence_contract.py \
              tests/test_profile_signature_core.py \
              tests/test_profile_signature_contract.py \
              tests/test_optional_sesh_setup_contract.py \
              tests/test_sesh_concept_contract.py \
              tests/test_command_surface_uniqueness.py \
              >> PHASE3_DIAGNOSTIC.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo 'STAGE: pre-integration regression suite' >> PHASE3_DIAGNOSTIC.log
            python -m pytest -q --tb=short -x \
              --ignore=tests/test_world_mode_integration_contract.py \
              >> PHASE3_DIAGNOSTIC.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            echo 'STAGE: cleanup and whitespace' >> PHASE3_DIAGNOSTIC.log
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
            git diff --check >> PHASE3_DIAGNOSTIC.log 2>&1
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact failure diagnostic
        if: steps.pipeline.outputs.exit_code != '0'
        run: |
          cp PHASE3_DIAGNOSTIC.log /tmp/PHASE3_DIAGNOSTIC.log
          git reset --hard HEAD
          cp /tmp/PHASE3_DIAGNOSTIC.log PHASE3_DIAGNOSTIC.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE3_DIAGNOSTIC.log
          git commit -m 'Record world mode phase 3 diagnostic'
          git push origin HEAD:feature/world-mode-controls

      - name: Stop after diagnostic publication
        if: steps.pipeline.outputs.exit_code != '0'
        run: exit 1

      - name: Commit and push validated phase 3 source
        if: steps.pipeline.outputs.exit_code == '0'
        run: |
          rm -f PHASE3_DIAGNOSTIC.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route lab casino sesh and profiles through world modes'
          git push origin HEAD:feature/world-mode-controls
