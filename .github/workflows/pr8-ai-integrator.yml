name: PR8 AI Integrator

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 8 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical AI setup integration
        run: python tools/apply_ai_setup_once.py
      - name: Install validation dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Validate implementation
        id: focused_tests
        shell: bash
        run: |
          set +e
          python -m py_compile ai.py setup.py > ai-focused.log 2>&1
          compile_code=$?
          if [ "$compile_code" -eq 0 ]; then
            python -m pytest -q tests/test_ai_chat_runtime.py tests/test_optional_ai_contract.py >> ai-focused.log 2>&1
            test_code=$?
          else
            test_code=$compile_code
          fi
          echo "exit_code=$test_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-ai-focused-log
          path: ai-focused.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when focused validation failed
        if: steps.focused_tests.outputs.exit_code != '0'
        run: |
          cat ai-focused.log
          exit 1
      - name: Commit only permanent implementation
        run: |
          rm -f tools/apply_ai_setup_once.py .github/workflows/apply-ai-setup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai.py setup.py tools/apply_ai_setup_once.py .github/workflows/apply-ai-setup-once.yml
          git commit -m 'Integrate optional AI into setup wizard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
