name: Apply World Mode Foundation

on:
  push:
    branches:
      - feature/world-mode-controls

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply foundation integration
        run: python tools/apply_world_mode_phase1.py

      - name: Remove temporary integration files
        run: |
          rm -f tools/apply_world_mode_phase1.py
          rm -f .github/workflows/apply-world-mode-foundation.yml

      - name: Validate foundation
        env:
          DISCORD_TOKEN: ''
          IDLE_SUPABASE_URL: ''
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          python -m compileall -q .
          python -m pytest -q tests/test_world_modes_core.py tests/test_startup_contract.py tests/test_command_surface_uniqueness.py
          python -m pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_world_mode_phase1.py
          test ! -f .github/workflows/apply-world-mode-foundation.yml

      - name: Commit foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add world mode foundation and isolation tests'
          git push origin HEAD:feature/world-mode-controls
