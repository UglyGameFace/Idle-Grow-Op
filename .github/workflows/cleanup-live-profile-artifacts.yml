name: Clean Live Profile Artifacts

on:
  push:
    branches:
      - feature/live-profile-signatures

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-signatures
          fetch-depth: 0

      - name: Remove generated bytecode
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          EOF
          rm .github/workflows/cleanup-live-profile-artifacts.yml

      - name: Verify cleanup
        run: |
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          git diff --check
          git status --short

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove generated bytecode artifacts'
          git push origin HEAD:feature/live-profile-signatures
