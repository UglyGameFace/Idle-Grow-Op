name: PR18 Notification Integrator

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.number == 18 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply canonical notification integration
        run: python tools/apply_notification_preferences.py

      - name: Validate focused implementation
        id: focused
        shell: bash
        run: |
          set +e
          python -m py_compile notification_preferences.py setup.py tasks.py main.py > notification-focused.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python -m pytest -q tests/test_notification_preferences_runtime.py tests/test_notification_preferences_contract.py >> notification-focused.log 2>&1
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr18-notification-focused-log
          path: notification-focused.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when focused validation failed
        if: steps.focused.outputs.exit_code != '0'
        run: |
          cat notification-focused.log
          exit 1

      - name: Commit only permanent implementation
        run: |
          rm tools/apply_notification_preferences.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add notification preferences and announcement role controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
