name: Apply World Mode Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feature/world-mode-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_TOKEN: ''
      IDLE_SUPABASE_URL: ''
      IDLE_SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply routing phase
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_world_mode_phase2.py')
          source = path.read_text(encoding='utf-8')
          marker = '# Keep the legacy-artifact guard aware of the new canonical module.'
          if marker not in source:
              raise RuntimeError('CI patch marker missing')
          path.write_text(source.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
          python tools/apply_world_mode_phase2.py
          python tools/migrate_admin_world_mode_contract.py
          python tools/migrate_routed_world_mode_contracts.py

      - name: Remove temporary patch scripts
        run: |
          rm -f tools/apply_world_mode_phase2.py
          rm -f tools/migrate_admin_world_mode_contract.py
          rm -f tools/migrate_routed_world_mode_contracts.py

      - name: Compile routed sources
        run: python -m compileall -q .

      - name: Run focused world mode tests
        run: python -m pytest -q tests/test_world_modes_core.py tests/test_startup_contract.py tests/test_command_surface_uniqueness.py tests/test_admin_integrity_contract.py tests/test_farming_scoped_persistence_contract.py

      - name: Run existing regression suite
        id: regressions
        run: |
          set +e
          python -m pytest -q --tb=short -x --ignore=tests/test_world_mode_integration_contract.py > phase2-regression.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload phase 2 regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-regression-log
          path: phase2-regression.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when regressions fail
        if: steps.regressions.outputs.exit_code != '0'
        run: |
          cat phase2-regression.log
          exit 1

      - name: Inspect cleanup and whitespace
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f phase2-regression.log phase2-publish.log
          git diff --check
          test ! -f tools/apply_world_mode_phase2.py
          test ! -f tools/migrate_admin_world_mode_contract.py
          test ! -f tools/migrate_routed_world_mode_contracts.py
          test -f .github/workflows/apply-world-mode-phase2.yml

      - name: Commit and push routed foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route core gameplay through world mode scopes'
          git push origin HEAD:feature/world-mode-controls
