name: Apply World Mode Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feature/world-mode-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/world-mode-controls
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply routing phase
        run: python tools/apply_world_mode_phase2.py

      - name: Remove temporary integration files
        run: |
          rm -f tools/apply_world_mode_phase2.py
          rm -f .github/workflows/apply-world-mode-phase2.yml

      - name: Validate routed modules and existing regressions
        env:
          DISCORD_TOKEN: ''
          IDLE_SUPABASE_URL: ''
          IDLE_SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          python -m compileall -q .
          python -m pytest -q tests/test_world_modes_core.py tests/test_startup_contract.py tests/test_command_surface_uniqueness.py
          python -m pytest -q --ignore=tests/test_world_mode_integration_contract.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_world_mode_phase2.py
          test ! -f .github/workflows/apply-world-mode-phase2.yml

      - name: Commit routed foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route core gameplay through world mode scopes'
          git push origin HEAD:feature/world-mode-controls
